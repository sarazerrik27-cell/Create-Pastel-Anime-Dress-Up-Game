
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Anime Dress Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">🌸 SAKURA <span>FASHION</span></div>
    <div class="subtitle">JAPANESE FASHION BOUTIQUE</div>
  </header>

  <main class="game">
    <section class="stage">
      <div class="stage-heading">
        <span>YOUR STYLE, YOUR STORY</span>
        <span class="live">● DRESS UP</span>
      </div>

      <div class="character-area">
        <div class="sparkle sparkle-one">✦</div>
        <div class="sparkle sparkle-two">✧</div>
        <div class="character-name" id="characterName">Sakura</div>
        <svg id="doll" viewBox="0 0 400 620" role="img" aria-label="Anime dress up character"></svg>
      </div>

      <div class="character-switch">
        <button id="prevCharacter" aria-label="Previous character">‹</button>
        <span id="characterLabel">01 / 03</span>
        <button id="nextCharacter" aria-label="Next character">›</button>
      </div>
    </section>

    <section class="wardrobe">
      <div class="wardrobe-title">
        <div>
          <span class="eyebrow">THE BOUTIQUE</span>
          <h1>Dress her up!</h1>
        </div>
        <span class="flower">🌷</span>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-category="tops">Tops</button>
        <button class="tab" data-category="bottoms">Bottoms</button>
        <button class="tab" data-category="dresses">Dresses</button>
        <button class="tab" data-category="shoes">Shoes</button>
        <button class="tab" data-category="hair">Hair</button>
        <button class="tab" data-category="accessories">Extras</button>
      </div>

      <div class="items" id="items"></div>

      <div class="color-panel">
        <label for="colorPicker">CUSTOM COLOUR</label>
        <input id="colorPicker" type="color" value="#f2a9c5">
        <span id="colorLabel">Pick a colour</span>
      </div>

      <div class="actions">
        <button id="randomBtn" class="secondary">🎲 Random outfit</button>
        <button id="resetBtn" class="primary">↻ Reset look</button>
      </div>
      <p class="tip">Choose an item, then change its colour to create your own style ♡</p>
    </section>
  </main>

  <footer>Made with love ♡ Sakura Fashion Studio</footer>
  <script src="script.js"></script>
</body>
</html>
